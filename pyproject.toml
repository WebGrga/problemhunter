[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "problem-hunter"
version = "0.1.0"
description = "Evidence-led discovery and ranking of real-world problems"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
problem-hunter = "problem_hunter.cli:main"

[tool.setuptools.packages.find]
include = ["problem_hunter*"]

[tool.setuptools.package-data]
problem_hunter = ["rubrics/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
